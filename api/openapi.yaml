openapi: 3.0.3
info:
  title: praying-mantis API
  version: 0.7.0
  description: |
    Contract between backend and frontend (decision 2). Agree changes together in a `T` story
    before implementing them. All routes are under /api. Errors are Problem Details (decision 21).

    Authentication (decision 12): `POST /auth/login` starts a server session, kept in an HttpOnly
    `SameSite=Lax` session cookie that the browser sends automatically. Every operation needs that
    session unless it says `security: []`. Without a valid session the answer is 401.

    CSRF: every response sets a readable `XSRF-TOKEN` cookie. Unsafe requests (POST, PUT, PATCH,
    DELETE), including login and logout, must copy it into the `X-XSRF-TOKEN` header; a missing or
    wrong token is 403. The token changes on login, so read the cookie on every request.
servers:
  - url: /api
tags:
  - name: hello
    description: Sample endpoint from BE-0.2, used to check that FE and BE are wired up (M0)
  - name: auth
    description: Log in and out (T-1.1)
  - name: me
    description: The logged-in user (T-1.1)
  - name: absences
    description: Absence types, balance and requests (T-2.1)
  - name: holidays
    description: Public holidays, excluded from working days (T-2.1, decision 15)
  - name: absence-requests
    description: Request and cancel my absences (T-3.1)
  - name: projects
    description: Projects to book hours on (T-6.1)
  - name: timesheets
    description: My weekly timesheets (T-6.1)
  - name: team-absences
    description: Absence requests I decide on as approver (T-5.1)
  - name: notifications
    description: In-app notifications for the bell, polled by the FE (T-4.1, decision 17)
security:
  - sessionCookie: []
paths:
  /hello:
    get:
      tags: [hello]
      operationId: getHello
      summary: Say hello
      security: []
      responses:
        '200':
          description: A greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hello'
        default:
          $ref: '#/components/responses/Problem'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with email and password
      description: |
        Checks the password against the stored BCrypt hash. On success, starts a new session (a new
        session id, so an old one can't be reused) and returns the logged-in user, so the FE doesn't
        need a second call to `GET /me`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in. The response sets the session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '401':
          description: |
            Wrong email or password. The detail is the same in both cases, so it doesn't reveal
            whether an account exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Invalid email or password
                instance: /api/auth/login
        default:
          $ref: '#/components/responses/Problem'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Log out
      description: |
        Invalidates the session and clears the cookie. 204 also without a session, so the FE can call
        it without checking first. Like every unsafe request, it needs the CSRF header.
      security: []
      responses:
        '204':
          description: Logged out
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        default:
          $ref: '#/components/responses/Problem'

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: The logged-in user
      description: |
        Used by the app shell for the user name and the role-dependent nav (Approvals only for team
        leads, Admin only for admins), and by the router guard: a 401 means "go to the login page".
      responses:
        '200':
          description: The logged-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /absence-types:
    get:
      tags: [absences]
      operationId: getAbsenceTypes
      summary: All absence types
      description: |
        Small, rarely changing list. The FE uses it for type names and for the request form (T-3.1).
        Balances and requests refer to a type by its `code`.
      responses:
        '200':
          description: Every type, ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AbsenceType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /me/absence-balance:
    get:
      tags: [absences]
      operationId: getMyAbsenceBalance
      summary: My balance per absence type for one year
      description: |
        One entry per type the user has an entitlement for in that year (BE-2.2). Days count in the
        year they fall in, so a request across New Year counts partly in each year. Half days are 0.5.
        `remainingDays` = entitled + carried over − used, and only types that deduct from the
        balance have it (decision 9: computed, not stored). Pending days aren't subtracted; the FE
        shows them next to the remaining days.
      parameters:
        - name: year
          in: query
          description: Defaults to the current year in Europe/Lisbon
          required: false
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
            example: 2026
      responses:
        '200':
          description: The balances, in absence type name order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AbsenceBalance'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /me/absence-requests:
    get:
      tags: [absences]
      operationId: getMyAbsenceRequests
      summary: My absence requests that overlap a date range
      description: |
        For the calendar (BE-2.3). Returns every request that overlaps `[from, to]` (both
        inclusive), in any status, ordered by start date. The FE hides rejected and cancelled ones
        by default. The range may be at most 366 days.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2026-09-28'
        - name: to
          in: query
          description: Inclusive; not before `from`
          required: true
          schema:
            type: string
            format: date
            example: '2026-11-08'
      responses:
        '200':
          description: The requests, by start date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AbsenceRequest'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [absence-requests]
      operationId: createMyAbsenceRequest
      summary: Request an absence
      description: |
        Creates a request for the logged-in user (BE-3.2). The backend computes `workingDays`
        (decision 15) and sets the approver (decision 16).

        - A type that requires approval starts `PENDING`, with the approver set. A type that doesn't
          (SICK) is `APPROVED` straight away, with `decidedAt` set and no approver.
        - Any type may start in the past, e.g. sick leave booked afterwards (decision 29).

        **400** (`errors` names the field):
        - `endDate` before `startDate`
        - day parts that don't fit (see `DayPart`)
        - no working days at all, e.g. only a weekend
        - a range longer than 366 days
        - a missing field, or a `reason` over 500 characters

        **409**, with the reason in the Problem's `type`:
        - `/problems/absence-overlap`: the days overlap one of the user's pending or approved
          requests (decision 14)
        - `/problems/insufficient-balance`: a type that deducts from the balance (VACATION) needs
          more days than are left in a year it touches. "Left" is entitled + carried over − approved;
          pending requests don't count against it. A year without an entitlement has none left
          (decision 29).
        - `/problems/no-approver`: nobody can approve it. That only happens to the sole admin
          without a team lead (decision 16).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAbsenceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceRequest'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /me/absence-requests/{id}/cancel:
    post:
      tags: [absence-requests]
      operationId: cancelMyAbsenceRequest
      summary: Cancel one of my absence requests
      description: |
        Sets the status to `CANCELLED` (decision 13) and frees its days (BE-3.3). A pending request
        can always be cancelled. An approved one only while its start date is still in the future,
        in Lisbon time; once the absence has started, it stays.

        **404** when the request doesn't exist or belongs to someone else, so ids of other people's
        requests aren't confirmed.

        **409** `/problems/absence-not-cancellable`: the request is already rejected or cancelled,
        or it's approved and has started.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 42
      responses:
        '200':
          description: The cancelled request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /public-holidays:
    get:
      tags: [holidays]
      operationId: getPublicHolidays
      summary: Public holidays of one year
      description: |
        Portugal's national holidays. Shown in the calendar and used for the working-days preview of
        the request form (T-3.1).
        The backend's working-days count is the authoritative one (decision 15).
      parameters:
        - name: year
          in: query
          description: Defaults to the current year in Europe/Lisbon
          required: false
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
            example: 2026
      responses:
        '200':
          description: The holidays, by date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicHoliday'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /projects:
    get:
      tags: [projects]
      operationId: getProjects
      summary: Projects to book hours on
      description: |
        BE-6.1. Ordered by code. `active` defaults to `true`, the projects that can take new hours.
        `active=false` returns the inactive ones only, e.g. to label old entries.
      parameters:
        - name: active
          in: query
          required: false
          description: Defaults to `true`
          schema:
            type: boolean
      responses:
        '200':
          description: The projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /me/timesheets/{weekStart}:
    get:
      tags: [timesheets]
      operationId: getMyTimesheet
      summary: My timesheet for one week
      description: |
        BE-6.2. Any week can be opened, past or future. A week that has never been saved comes back as
        an empty `DRAFT` without an `id`: nothing is stored until the first save or submit
        (decision 32). So opening a week has no side effects, and browsing doesn't create rows.

        Also returns the week's approved absences and public holidays, read-only, so the grid can
        mark those days.

        **400** on `weekStart` when it isn't a Monday.
      parameters:
        - $ref: '#/components/parameters/WeekStart'
      responses:
        '200':
          description: The week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheet'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /me/timesheets/{weekStart}/entries:
    put:
      tags: [timesheets]
      operationId: saveMyTimesheetEntries
      summary: Replace all entries of my week
      description: |
        BE-6.3. The body is the whole grid: every entry of the week. Entries missing from it are
        deleted, so an empty list clears the week. All of it happens in one transaction. Creates the
        timesheet on the first save.

        **400** (`errors[].field` is e.g. `entries[2].hours`):
        - `weekStart` isn't a Monday
        - a `workDate` outside the week
        - an unknown project, or an inactive one that isn't already on this timesheet
        - `hours` not in (0, 24], or not in quarter hours
        - two entries for the same project and day (the grid has one cell each)
        - a day with more than 24 hours in total (field `entries`)
        - a `description` over 500 characters

        **409** `/problems/timesheet-not-editable`: the week is `SUBMITTED` or `APPROVED`. A
        `REJECTED` week can be edited again.
      parameters:
        - $ref: '#/components/parameters/WeekStart'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimesheetEntries'
      responses:
        '200':
          description: The saved week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheet'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /me/timesheets/{weekStart}/submit:
    post:
      tags: [timesheets]
      operationId: submitMyTimesheet
      summary: Submit my week for approval
      description: |
        BE-6.4. `DRAFT` or `REJECTED` → `SUBMITTED`. Sets `submittedAt` and the approver, with the same
        rule as for absences (decision 16), and notifies them (`TIMESHEET_SUBMITTED`, T-4.1). A
        week with no hours can be submitted too, e.g. a week spent on vacation. The previous
        rejection's `decisionComment` is cleared.

        **409**:
        - `/problems/timesheet-not-editable`: it's already `SUBMITTED` or `APPROVED`
        - `/problems/no-approver`: the sole admin without a team lead (decision 16)
      parameters:
        - $ref: '#/components/parameters/WeekStart'
      responses:
        '200':
          description: The submitted week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheet'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /me/notifications:
    get:
      tags: [notifications]
      operationId: getMyNotifications
      summary: My notifications, newest first
      description: |
        For the bell's dropdown (FE-4.1). Only the logged-in user's own notifications (BE-4.2),
        newest first (by `createdAt`, then `id`; ids grow with time, so that's the same as `id`
        descending).

        Paginated with a cursor: pass the `id` of the last item you have as `before` to get the next
        page. `hasMore` says whether there is one. A cursor doesn't skip or repeat items when new
        notifications arrive between two pages, which page numbers would.
      parameters:
        - name: unread
          in: query
          description: '`true` returns only unread notifications. Left out or `false`: all of them.'
          required: false
          schema:
            type: boolean
            example: true
        - name: limit
          in: query
          description: Page size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: before
          in: query
          description: Only notifications with an `id` lower than this one (the next page)
          required: false
          schema:
            type: integer
            format: int64
            example: 118
      responses:
        '200':
          description: One page of notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /me/notifications/unread-count:
    get:
      tags: [notifications]
      operationId: getMyUnreadNotificationCount
      summary: How many of my notifications are unread
      description: |
        The bell's badge. The FE polls it every 30 s and when the tab regains focus (decision 17),
        so it has to stay cheap: one `count(*)` on an index over `(user_id) WHERE read_at IS NULL`.
      responses:
        '200':
          description: The unread count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /me/notifications/{id}/read:
    post:
      tags: [notifications]
      operationId: markMyNotificationRead
      summary: Mark one of my notifications as read
      description: |
        Sets `readAt` to now. Idempotent: a notification that is already read keeps its first
        `readAt`, and the answer is still 204.

        **404** when the notification doesn't exist or belongs to someone else, so ids of other
        people's notifications aren't confirmed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 118
      responses:
        '204':
          description: Read
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /me/notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllMyNotificationsRead
      summary: Mark all my notifications as read
      description: |
        Sets `readAt` to now on every unread notification of the logged-in user. 204 also when
        there was nothing to mark.
      responses:
        '204':
          description: All read
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        default:
          $ref: '#/components/responses/Problem'

  /team/absence-requests:
    get:
      tags: [team-absences]
      operationId: getTeamAbsenceRequests
      summary: Absence requests I'm the approver of
      description: |
        For the Approvals page (BE-5.1). Returns the requests whose approver is the logged-in user
        (decision 16): their team members' requests, a team lead's lead's, or, for the admin
        fallback, the requests of people without a team lead. Someone who approves nobody gets an
        empty list, not a 403, so the page can just say "nothing to approve".

        Filtered by `status`, which defaults to `PENDING`. Pending requests come oldest start date
        first, since the soonest need a decision first. Other statuses come newest start first.
      parameters:
        - name: status
          in: query
          required: false
          description: Defaults to `PENDING`
          schema:
            $ref: '#/components/schemas/AbsenceStatus'
      responses:
        '200':
          description: The requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamAbsenceRequest'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /team/absence-requests/{id}/approve:
    post:
      tags: [team-absences]
      operationId: approveAbsenceRequest
      summary: Approve a pending request
      description: |
        BE-5.2. Sets `APPROVED` and `decidedAt`, stores the optional comment, and notifies the
        requester (`ABSENCE_APPROVED`, T-4.1).

        - **403** unless the caller is the request's approver or an admin. Nobody decides on their
          own request, not even an admin (decision 16).
        - **409** `/problems/absence-not-pending`: it's already decided or cancelled.
        - **409** `/problems/insufficient-balance`: a VACATION request that no longer fits, because
          another request was approved in the meantime (decision 29). The approver can still reject
          it.
      parameters:
        - $ref: '#/components/parameters/AbsenceRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceDecision'
      responses:
        '200':
          description: The approved request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceRequest'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /team/absence-requests/{id}/reject:
    post:
      tags: [team-absences]
      operationId: rejectAbsenceRequest
      summary: Reject a pending request
      description: |
        BE-5.2. Sets `REJECTED` and `decidedAt`, stores the comment, and notifies the requester
        (`ABSENCE_REJECTED`, T-4.1). **The comment is required**, so the requester learns why; a
        missing or blank one is a 400 on `comment`.

        Same 403, 404 and 409 `/problems/absence-not-pending` as approve. There's no balance check:
        a rejection frees days, it never uses them.
      parameters:
        - $ref: '#/components/parameters/AbsenceRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceDecision'
      responses:
        '200':
          description: The rejected request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceRequest'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    sessionCookie:
      description: Server session from `POST /auth/login` (decision 12)
      type: apiKey
      in: cookie
      name: JSESSIONID

  parameters:
    WeekStart:
      name: weekStart
      in: path
      required: true
      description: The Monday of the week
      schema:
        type: string
        format: date
        example: '2026-09-28'

    AbsenceRequestId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 42

  schemas:
    Hello:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Hello from praying-mantis

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: ana.silva@cofinpro.pt
        password:
          type: string
          minLength: 1
          # BCrypt only uses the first 72 bytes
          maxLength: 72
          example: secret

    CurrentUser:
      type: object
      required: [id, name, email, client, level, isAdmin, isTeamLead]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        name:
          type: string
          example: Ana Silva
        email:
          type: string
          format: email
          example: ana.silva@cofinpro.pt
        client:
          $ref: '#/components/schemas/Client'
        level:
          $ref: '#/components/schemas/Level'
        isAdmin:
          description: The "privileged account"; shows the Admin nav item
          type: boolean
          example: false
        isTeamLead:
          description: Derived, true when someone has this user as team lead (decision 9); shows Approvals
          type: boolean
          example: true

    Client:
      description: The client a user works for. The FE maps codes to display names.
      type: string
      enum: [DKB, DEKA, VV, DBIS, UNION]
      example: DKB

    Level:
      type: string
      enum: [JUNIOR, EXPERT, SENIOR, ARCHITECT, SENIOR_ARCHITECT]
      example: SENIOR

    AbsenceTypeCode:
      type: string
      enum: [VACATION, SICK, PARENTAL, UNPAID, TRAINING]
      example: VACATION

    AbsenceType:
      type: object
      required: [code, name, isPaid, deductsFromBalance, requiresApproval]
      properties:
        code:
          $ref: '#/components/schemas/AbsenceTypeCode'
        name:
          type: string
          example: Vacation
        isPaid:
          type: boolean
          example: true
        deductsFromBalance:
          description: Only these types have a `remainingDays` in the balance
          type: boolean
          example: true
        requiresApproval:
          description: Without approval a new request is `APPROVED` right away (e.g. sick leave)
          type: boolean
          example: true

    AbsenceBalance:
      type: object
      required: [type, year, entitledDays, carriedOverDays, usedDays, pendingDays]
      properties:
        type:
          $ref: '#/components/schemas/AbsenceTypeCode'
        year:
          type: integer
          example: 2026
        entitledDays:
          type: number
          multipleOf: 0.5
          example: 25
        carriedOverDays:
          type: number
          multipleOf: 0.5
          example: 3
        usedDays:
          description: Working days of approved requests in this year
          type: number
          multipleOf: 0.5
          example: 9.5
        pendingDays:
          description: Working days of pending requests in this year
          type: number
          multipleOf: 0.5
          example: 2
        remainingDays:
          description: entitled + carried over − used. Only for types that deduct from the balance.
          type: number
          multipleOf: 0.5
          example: 18.5

    DayPart:
      description: |
        Which part of the start or end day is taken. On a multi-day request the first day is FULL or
        AFTERNOON and the last day FULL or MORNING, so there's no gap in the middle. A single day has
        the same part at both ends, and MORNING or AFTERNOON makes it a half day (0.5).
      type: string
      enum: [FULL, MORNING, AFTERNOON]
      example: FULL

    AbsenceStatus:
      description: See decision 13 (`CANCELLED`, not `withdrawn`)
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]
      example: PENDING

    NewAbsenceRequest:
      type: object
      required: [type, startDate, endDate, startPart, endPart]
      properties:
        type:
          $ref: '#/components/schemas/AbsenceTypeCode'
        startDate:
          type: string
          format: date
          example: '2026-10-26'
        endDate:
          description: Inclusive; same as `startDate` for a single day
          type: string
          format: date
          example: '2026-10-27'
        startPart:
          $ref: '#/components/schemas/DayPart'
        endPart:
          description: For a single day, the same as `startPart`
          allOf:
            - $ref: '#/components/schemas/DayPart'
        reason:
          type: string
          maxLength: 500
          example: Long weekend in Lisbon

    Project:
      type: object
      required: [id, code, name, isBillable, isActive]
      properties:
        id:
          type: integer
          format: int64
          example: 3
        code:
          type: string
          example: DKB-CORE
        name:
          type: string
          example: DKB core banking
        client:
          description: Absent for internal projects
          allOf:
            - $ref: '#/components/schemas/Client'
        isBillable:
          type: boolean
          example: true
        isActive:
          description: Only active projects take new hours
          type: boolean
          example: true

    TimesheetStatus:
      description: DRAFT → SUBMITTED → APPROVED or REJECTED; REJECTED → SUBMITTED again after edits
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED]
      example: DRAFT

    Timesheet:
      type: object
      required: [weekStart, status, entries, totalHours, absences, holidays]
      properties:
        id:
          description: Absent for a week that has never been saved (decision 32)
          type: integer
          format: int64
          example: 12
        weekStart:
          type: string
          format: date
          example: '2026-09-28'
        status:
          $ref: '#/components/schemas/TimesheetStatus'
        approver:
          description: Set on submit
          allOf:
            - $ref: '#/components/schemas/UserRef'
        submittedAt:
          type: string
          format: date-time
          example: '2026-10-02T16:30:00Z'
        decidedAt:
          type: string
          format: date-time
          example: '2026-10-05T09:00:00Z'
        decisionComment:
          description: The approver's comment, e.g. why the week was rejected
          type: string
          example: Please book Thursday on DKB-CORE
        entries:
          description: Ordered by project code, then day
          type: array
          items:
            $ref: '#/components/schemas/TimeEntry'
        totalHours:
          type: number
          example: 38.5
        absences:
          description: The user's approved absences that overlap the week, read-only
          type: array
          items:
            $ref: '#/components/schemas/AbsenceRequest'
        holidays:
          description: Public holidays in the week
          type: array
          items:
            $ref: '#/components/schemas/PublicHoliday'

    TimeEntry:
      type: object
      required: [id, project, workDate, hours]
      properties:
        id:
          type: integer
          format: int64
          example: 101
        project:
          $ref: '#/components/schemas/ProjectRef'
        workDate:
          type: string
          format: date
          example: '2026-09-29'
        hours:
          type: number
          example: 7.5
        description:
          type: string
          example: Sprint planning

    ProjectRef:
      description: Enough of a project to label an entry, even an inactive one
      type: object
      required: [id, code, name]
      properties:
        id:
          type: integer
          format: int64
          example: 3
        code:
          type: string
          example: DKB-CORE
        name:
          type: string
          example: DKB core banking

    TimesheetEntries:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/TimeEntryInput'

    TimeEntryInput:
      type: object
      required: [projectId, workDate, hours]
      properties:
        projectId:
          type: integer
          format: int64
          example: 3
        workDate:
          type: string
          format: date
          example: '2026-09-29'
        hours:
          description: More than 0, at most 24, in quarter hours
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 24
          multipleOf: 0.25
          example: 7.5
        description:
          type: string
          maxLength: 500
          example: Sprint planning

    TeamAbsenceRequest:
      description: A request as its approver sees it
      type: object
      required: [request, requester]
      properties:
        request:
          $ref: '#/components/schemas/AbsenceRequest'
        requester:
          $ref: '#/components/schemas/UserRef'
        remainingDays:
          description: |
            The requester's days left of this type in the year the request starts: entitled +
            carried over − approved (decision 29). Only for types that deduct from the balance
            (VACATION). A pending request isn't subtracted yet, so it fits while `workingDays` ≤
            `remainingDays`.
          type: number
          multipleOf: 0.5
          example: 12.5

    AbsenceDecision:
      type: object
      properties:
        comment:
          description: Required to reject (1–500 characters), optional to approve
          type: string
          maxLength: 500
          example: Release week, please pick another one

    UserRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Alex Admin

    AbsenceRequest:
      type: object
      required: [id, type, startDate, endDate, startPart, endPart, workingDays, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 42
        type:
          $ref: '#/components/schemas/AbsenceTypeCode'
        startDate:
          type: string
          format: date
          example: '2026-10-26'
        endDate:
          description: Inclusive; same as `startDate` for a single day
          type: string
          format: date
          example: '2026-10-27'
        startPart:
          $ref: '#/components/schemas/DayPart'
        endPart:
          description: For a single day, `startPart` and `endPart` are the same
          allOf:
            - $ref: '#/components/schemas/DayPart'
        workingDays:
          description: Computed by the backend when the request was created (decision 15)
          type: number
          multipleOf: 0.5
          example: 2
        status:
          $ref: '#/components/schemas/AbsenceStatus'
        reason:
          type: string
          maxLength: 500
          example: Long weekend in Lisbon
        approver:
          description: Who decides; normally the team lead (decision 16). Absent when no approval is needed.
          allOf:
            - $ref: '#/components/schemas/UserRef'
        decidedAt:
          type: string
          format: date-time
          example: '2026-09-26T09:15:00Z'
        decisionComment:
          description: Optional comment from the approver, e.g. why it was rejected
          type: string
          maxLength: 500
        createdAt:
          type: string
          format: date-time
          example: '2026-09-25T14:02:00Z'

    PublicHoliday:
      type: object
      required: [date, name]
      properties:
        date:
          type: string
          format: date
          example: '2026-10-05'
        name:
          type: string
          example: Republic Day

    NotificationType:
      description: |
        What happened. The FE picks the icon colour from it; the text comes ready in `message`.

        | Type | Sent to | When | `link` |
        |---|---|---|---|
        | ABSENCE_REQUESTED | the approver | a request needs a decision (BE-3.2) | `/approvals` |
        | ABSENCE_APPROVED | the requester | the approver approved it (BE-5.2) | `/absences?request={id}` |
        | ABSENCE_REJECTED | the requester | the approver rejected it (BE-5.2) | `/absences?request={id}` |
        | ABSENCE_CANCELLED | the approver | the requester cancelled an approved request (BE-3.3) | `/approvals` |
        | TIMESHEET_SUBMITTED | the approver | a week was submitted (BE-6.4) | `/approvals?tab=timesheets` |
        | TIMESHEET_APPROVED | the owner | the approver approved it (BE-7.x) | `/timesheets?week={weekStart}` |
        | TIMESHEET_REJECTED | the owner | the approver rejected it (BE-7.x) | `/timesheets?week={weekStart}` |

        Automatically approved requests (SICK) notify nobody.
      type: string
      enum:
        - ABSENCE_REQUESTED
        - ABSENCE_APPROVED
        - ABSENCE_REJECTED
        - ABSENCE_CANCELLED
        - TIMESHEET_SUBMITTED
        - TIMESHEET_APPROVED
        - TIMESHEET_REJECTED
      example: ABSENCE_REQUESTED

    Notification:
      type: object
      required: [id, type, message, link, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 118
        type:
          $ref: '#/components/schemas/NotificationType'
        message:
          description: |
            Ready-to-show English sentence, written by the backend when the notification is created
            (so it doesn't change later). The FE shows it as it is.
          type: string
          maxLength: 500
          example: Carla Mendes requested 5 days of vacation (2–6 Nov)
        link:
          description: |
            Where clicking it goes: a path inside the app, starting with a single `/` (never a full
            URL). The FE only follows paths like that.
          type: string
          maxLength: 255
          pattern: '^/(?![/\\]).*'
          example: /approvals
        readAt:
          description: When it was read. Absent or null while unread.
          type: string
          format: date-time
          nullable: true
          example: '2026-09-25T15:10:00Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-09-25T14:02:00Z'

    NotificationPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          description: Newest first
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        hasMore:
          description: More (older) items exist; ask again with `before` = the last item's `id`
          type: boolean
          example: false

    UnreadCount:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 0
          example: 3

    Problem:
      description: RFC 9457 Problem Details (decision 21)
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          description: Field errors, only on 400 validation responses
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: must not be blank

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ValidationProblem:
      description: Invalid request; `errors` lists the fields
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Request has invalid fields
            instance: /api/auth/login
            errors:
              - field: email
                message: must be a well-formed email address

    CsrfForbidden:
      description: Missing or wrong `X-XSRF-TOKEN` header
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Unauthorized:
      description: Not logged in, or the session expired
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            instance: /api/me

    Forbidden:
      description: Logged in, but not allowed to do this; also a missing or wrong CSRF token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: You are not allowed to do this
            instance: /api/team/absence-requests/42/approve

    NotFound:
      description: No such resource, or it isn't yours
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Absence request not found
            instance: /api/me/absence-requests/42/cancel

    Conflict:
      description: |
        The request is valid but breaks a business rule. `type` says which one, so the FE can pick
        its message; `detail` is a human-readable English sentence.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/insufficient-balance
            title: Conflict
            status: 409
            detail: Only 3 vacation days left in 2026, but the request needs 5
            instance: /api/me/absence-requests

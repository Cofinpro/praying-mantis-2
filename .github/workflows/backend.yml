# BE-0.3: build and test the backend on every PR and on main (CONTRIBUTING.md §5).
# The job name "backend" is the required status check in scripts/setup-branch-protection.sh.
name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

# No path filter on purpose: a required check that never runs (e.g. on an FE-only PR) blocks the merge.

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify = compile + unit tests + Testcontainers tests (Docker is preinstalled on ubuntu runners, decision #10).
      # generate-sources regenerates the API interfaces from api/openapi.yaml on every run, so a controller that
      # doesn't match the contract fails compilation here (decision #3).
      - name: Build and test
        run: ./mvnw -B -ntp verify

      # Generated code lives in target/ and isn't committed. If a build step ever writes into tracked files
      # (e.g. generated code checked in by mistake), this makes the drift visible instead of silent.
      - name: Check the build left no tracked files changed
        run: git diff --exit-code

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

spring:
  application:
    name: praying-mantis-backend
  datasource:
    # File-based H2 database, stored in backend/data (git-ignored)
    url: jdbc:h2:file:./data/praying-mantis;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

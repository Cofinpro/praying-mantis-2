# Master changelog (decision #23). Include one changelog per story, in the order they were merged.
# Never edit a changeset that has already run: its checksum would fail. Add a new one instead.
databaseChangeLog:
  - include:
      file: changes/0001-SCRUM-16-baseline.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/0002-SCRUM-23-users.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/0003-SCRUM-30-absences.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/0006-SCRUM-44-notifications.yaml
      relativeToChangelogFile: true
  # Merged after 0006: the include order is the order changesets ran in, not the file number
  - include:
      file: changes/0004-SCRUM-56-projects.yaml
      relativeToChangelogFile: true

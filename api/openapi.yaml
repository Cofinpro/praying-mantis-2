        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin (checked against the DB on every call, decision 11), or a missing CSRF token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [admin-holidays]
      operationId: deleteAdminPublicHoliday
      summary: Delete a public holiday
      description: 'BE-9.4. Existing requests keep their stored working days (decision 15).'
      parameters:
        - $ref: '#/components/parameters/HolidayId'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin (checked against the DB on every call, decision 11), or a missing CSRF token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    sessionCookie:
      description: Server session from `POST /auth/login` (decision 12)
      type: apiKey
      in: cookie
      name: JSESSIONID

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 5
    HolidayId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 14
    Month:
      name: month
      in: path
      required: true
      description: '`YYYY-MM`'
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        example: '2026-10'

    TimesheetId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 12

    WeekStart:
      name: weekStart
      in: path
      required: true
      description: The Monday of the week
      schema:
        type: string
        format: date
        example: '2026-09-28'

    AbsenceRequestId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 42

  schemas:
    Hello:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Hello from praying-mantis

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: ana.silva@cofinpro.pt
        password:
          type: string
          minLength: 1
          # BCrypt only uses the first 72 bytes
          maxLength: 72
          example: secret

    CurrentUser:
      type: object
      required: [id, name, email, client, level, isAdmin, isTeamLead]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        name:
          type: string
          example: Ana Silva
        email:
          type: string
          format: email
          example: ana.silva@cofinpro.pt
        client:
          $ref: '#/components/schemas/Client'
        level:
          $ref: '#/components/schemas/Level'
        isAdmin:
          description: The "privileged account"; shows the Admin nav item
          type: boolean
          example: false
        isTeamLead:
          description: Derived, true when someone has this user as team lead (decision 9); shows Approvals
          type: boolean
          example: true

    Client:
      description: The client a user works for. The FE maps codes to display names.
      type: string
      enum: [DKB, DEKA, VV, DBIS, UNION]
      example: DKB

    Level:
      type: string
      enum: [JUNIOR, EXPERT, SENIOR, ARCHITECT, SENIOR_ARCHITECT]
      example: SENIOR

    AbsenceTypeCode:
      type: string
      enum: [VACATION, SICK, PARENTAL, UNPAID, TRAINING]
      example: VACATION

    AbsenceType:
      type: object
      required: [code, name, isPaid, deductsFromBalance, requiresApproval]
      properties:
        code:
          $ref: '#/components/schemas/AbsenceTypeCode'
        name:
          type: string
          example: Vacation
        isPaid:
          type: boolean
          example: true
        deductsFromBalance:
          description: Only these types have a `remainingDays` in the balance
          type: boolean
          example: true
        requiresApproval:
          description: Without approval a new request is `APPROVED` right away (e.g. sick leave)
          type: boolean
          example: true

    AbsenceBalance:
      type: object
      required: [type, year, entitledDays, carriedOverDays, usedDays, pendingDays]
      properties:
        type:
          $ref: '#/components/schemas/AbsenceTypeCode'
        year:
          type: integer
          example: 2026
        entitledDays:
          type: number
          multipleOf: 0.5
          example: 25
        carriedOverDays:
          type: number
          multipleOf: 0.5
          example: 3
        usedDays:
          description: Working days of approved requests in this year
          type: number
          multipleOf: 0.5
          example: 9.5
        pendingDays:
          description: Working days of pending requests in this year
          type: number
          multipleOf: 0.5
          example: 2
        remainingDays:
          description: entitled + carried over − used. Only for types that deduct from the balance.
          type: number
          multipleOf: 0.5
          example: 18.5

    DayPart:
      description: |
        Which part of the start or end day is taken. On a multi-day request the first day is FULL or
        AFTERNOON and the last day FULL or MORNING, so there's no gap in the middle. A single day has
        the same part at both ends, and MORNING or AFTERNOON makes it a half day (0.5).
      type: string
      enum: [FULL, MORNING, AFTERNOON]
      example: FULL

    AbsenceStatus:
      description: See decision 13 (`CANCELLED`, not `withdrawn`)
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]
      example: PENDING

    NewAbsenceRequest:
      type: object
      required: [type, startDate, endDate, startPart, endPart]
      properties:
        type:
          $ref: '#/components/schemas/AbsenceTypeCode'
        startDate:
          type: string
          format: date
          example: '2026-10-26'
        endDate:
          description: Inclusive; same as `startDate` for a single day
          type: string
          format: date
          example: '2026-10-27'
        startPart:
          $ref: '#/components/schemas/DayPart'
        endPart:
          description: For a single day, the same as `startPart`
          allOf:
            - $ref: '#/components/schemas/DayPart'
        reason:
          type: string
          maxLength: 500
          example: Long weekend in Lisbon

    Project:
      type: object
      required: [id, code, name, isBillable, isActive]
      properties:
        id:
          type: integer
          format: int64
          example: 3
        code:
          type: string
          example: DKB-CORE
        name:
          type: string
          example: DKB core banking
        client:
          description: Absent for internal projects
          allOf:
            - $ref: '#/components/schemas/Client'
        isBillable:
          type: boolean
          example: true
        isActive:
          description: Only active projects take new hours
          type: boolean
          example: true

    TimesheetStatus:
      description: DRAFT → SUBMITTED → APPROVED or REJECTED; REJECTED → SUBMITTED again after edits
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED]
      example: DRAFT

    Timesheet:
      type: object
      required: [weekStart, status, entries, totalHours, absences, holidays]
      properties:
        id:
          description: Absent for a week that has never been saved (decision 32)
          type: integer
          format: int64
          example: 12
        weekStart:
          type: string
          format: date
          example: '2026-09-28'
        status:
          $ref: '#/components/schemas/TimesheetStatus'
        approver:
          description: Set on submit
          allOf:
            - $ref: '#/components/schemas/UserRef'
        submittedAt:
          type: string
          format: date-time
          example: '2026-10-02T16:30:00Z'
        decidedAt:
          type: string
          format: date-time
          example: '2026-10-05T09:00:00Z'
        decisionComment:
          description: The approver's comment, e.g. why the week was rejected
          type: string
          example: Please book Thursday on DKB-CORE
        entries:
          description: Ordered by project code, then day
          type: array
          items:
            $ref: '#/components/schemas/TimeEntry'
        totalHours:
          type: number
          example: 38.5
        absences:
          description: The user's approved absences that overlap the week, read-only
          type: array
          items:
            $ref: '#/components/schemas/AbsenceRequest'
        holidays:
          description: Public holidays in the week
          type: array
          items:
            $ref: '#/components/schemas/PublicHoliday'

    TimeEntry:
      type: object
      required: [id, project, workDate, hours]
      properties:
        id:
          type: integer
          format: int64
          example: 101
        project:
          $ref: '#/components/schemas/ProjectRef'
        workDate:
          type: string
          format: date
          example: '2026-09-29'
        hours:
          type: number
          example: 7.5
        description:
          type: string
          example: Sprint planning

    ProjectRef:
      description: Enough of a project to label an entry, even an inactive one
      type: object
      required: [id, code, name]
      properties:
        id:
          type: integer
          format: int64
          example: 3
        code:
          type: string
          example: DKB-CORE
        name:
          type: string
          example: DKB core banking

    ExportTemplate:
      type: object
      required: [code, name]
      properties:
        code:
          description: What `GET /me/timesheet-exports` takes as `template`
          type: string
          example: GENERIC
        name:
          type: string
          example: Generic monthly timesheet
        client:
          description: The client it's for; absent for the generic template
          allOf:
            - $ref: '#/components/schemas/Client'

    TimesheetMonth:
      type: object
      required: [month, totalHours, weeks]
      properties:
        month:
          type: string
          example: '2026-10'
        totalHours:
          description: Hours with a `workDate` in the month, from weeks in any status
          type: number
          example: 152.5
        weeks:
          description: Every week that touches the month, by `weekStart`
          type: array
          items:
            $ref: '#/components/schemas/TimesheetMonthWeek'

    TimesheetMonthWeek:
      type: object
      required: [weekStart, status, hoursInMonth]
      properties:
        weekStart:
          type: string
          format: date
          example: '2026-09-28'
        status:
          $ref: '#/components/schemas/TimesheetStatus'
        hoursInMonth:
          description: Only the hours of this week's days that fall in the month
          type: number
          example: 16

    TeamTimesheet:
      description: A week as its approver sees it
      type: object
      required: [timesheet, user, projectHours]
      properties:
        timesheet:
          $ref: '#/components/schemas/Timesheet'
        user:
          $ref: '#/components/schemas/UserRef'
        projectHours:
          description: Total hours per project in the week, by project code
          type: array
          items:
            $ref: '#/components/schemas/ProjectHours'

    ProjectHours:
      type: object
      required: [project, hours]
      properties:
        project:
          $ref: '#/components/schemas/ProjectRef'
        hours:
          type: number
          example: 32

    TimesheetDecision:
      type: object
      properties:
        comment:
          description: Required to reject (1–500 characters), optional to approve
          type: string
          maxLength: 500
          example: Please book Thursday on DKB-CORE

    TimesheetEntries:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/TimeEntryInput'

    TimeEntryInput:
      type: object
      required: [projectId, workDate, hours]
      properties:
        projectId:
          type: integer
          format: int64
          example: 3
        workDate:
          type: string
          format: date
          example: '2026-09-29'
        hours:
          description: More than 0, at most 24, in quarter hours
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 24
          multipleOf: 0.25
          example: 7.5
        description:
          type: string
          maxLength: 500
          example: Sprint planning

    TeamAbsenceRequest:
      description: A request as its approver sees it
      type: object
      required: [request, requester]
      properties:
        request:
          $ref: '#/components/schemas/AbsenceRequest'
        requester:
          $ref: '#/components/schemas/UserRef'
        remainingDays:
          description: |
            The requester's days left of this type in the year the request starts: entitled +
            carried over − approved (decision 29). Only for types that deduct from the balance
            (VACATION). A pending request isn't subtracted yet, so it fits while `workingDays` ≤
            `remainingDays`.
          type: number
          multipleOf: 0.5
          example: 12.5

    AbsenceDecision:
      type: object
      properties:
        comment:
          description: Required to reject (1–500 characters), optional to approve
          type: string
          maxLength: 500
          example: Release week, please pick another one

    AdminUser:
      type: object
      required: [id, name, email, client, level, isAdmin, isTeamLead]
      properties:
        id:
          type: integer
          format: int64
          example: 5
        name:
          type: string
          example: Eva Santos
        email:
          type: string
          format: email
          example: eva.santos@cofinpro.pt
        client:
          $ref: '#/components/schemas/Client'
        level:
          $ref: '#/components/schemas/Level'
        isAdmin:
          type: boolean
          example: false
        isTeamLead:
          description: Derived, someone has this user as team lead (decision 9)
          type: boolean
          example: false
        teamLead:
          description: Absent when the user has none (then an admin approves, decision 16)
          allOf:
            - $ref: '#/components/schemas/UserRef'

    AdminUserUpdate:
      type: object
      required: [name, email, client, level, isAdmin]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Eva Santos
        email:
          type: string
          format: email
          maxLength: 255
          example: eva.santos@cofinpro.pt
        client:
          $ref: '#/components/schemas/Client'
        level:
          $ref: '#/components/schemas/Level'
        isAdmin:
          type: boolean
          example: false
        teamLeadId:
          description: Leave it out for no team lead
          type: integer
          format: int64
          example: 3

    NewAdminUser:
      allOf:
        - $ref: '#/components/schemas/AdminUserUpdate'
        - type: object
          required: [password]
          properties:
            password:
              type: string
              minLength: 8
              maxLength: 72
              example: change-me-please

    PasswordReset:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 72
          example: change-me-please

    AdminEntitlement:
      type: object
      required: [id, user, type, year, entitledDays, carriedOverDays]
      properties:
        id:
          type: integer
          format: int64
          example: 31
        user:
          $ref: '#/components/schemas/UserRef'
        type:
          $ref: '#/components/schemas/AbsenceTypeCode'
        year:
          type: integer
          example: 2027
        entitledDays:
          type: number
          example: 22
        carriedOverDays:
          type: number
          example: 2.5

    EntitlementInput:
      type: object
      required: [userId, type, year, entitledDays, carriedOverDays]
      properties:
        userId:
          type: integer
          format: int64
          example: 5
        type:
          $ref: '#/components/schemas/AbsenceTypeCode'
        year:
          type: integer
          minimum: 2000
          maximum: 2100
          example: 2027
        entitledDays:
          description: 0 to 366, in steps of 0.5
          type: number
          minimum: 0
          maximum: 366
          multipleOf: 0.5
          example: 22
        carriedOverDays:
          description: 0 to 366, in steps of 0.5
          type: number
          minimum: 0
          maximum: 366
          multipleOf: 0.5
          example: 2.5

    ProjectInput:
      type: object
      required: [code, name, isBillable, isActive]
      properties:
        code:
          description: Letters, digits and dashes, stored in upper case
          type: string
          pattern: '^[A-Za-z0-9-]{2,30}$'
          example: DKB-CORE
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: DKB core banking
        client:
          description: Leave it out for an internal project
          allOf:
            - $ref: '#/components/schemas/Client'
        isBillable:
          type: boolean
          example: true
        isActive:
          type: boolean
          example: true

    AdminPublicHoliday:
      type: object
      required: [id, date, name]
      properties:
        id:
          type: integer
          format: int64
          example: 14
        date:
          type: string
          format: date
          example: '2028-04-25'
        name:
          type: string
          example: Freedom Day

    UserRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Alex Admin

    AbsenceRequest:
      type: object
      required: [id, type, startDate, endDate, startPart, endPart, workingDays, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 42
        type:
          $ref: '#/components/schemas/AbsenceTypeCode'
        startDate:
          type: string
          format: date
          example: '2026-10-26'
        endDate:
          description: Inclusive; same as `startDate` for a single day
          type: string
          format: date
          example: '2026-10-27'
        startPart:
          $ref: '#/components/schemas/DayPart'
        endPart:
          description: For a single day, `startPart` and `endPart` are the same
          allOf:
            - $ref: '#/components/schemas/DayPart'
        workingDays:
          description: Computed by the backend when the request was created (decision 15)
          type: number
          multipleOf: 0.5
          example: 2
        status:
          $ref: '#/components/schemas/AbsenceStatus'
        reason:
          type: string
          maxLength: 500
          example: Long weekend in Lisbon
        approver:
          description: Who decides; normally the team lead (decision 16). Absent when no approval is needed.
          allOf:
            - $ref: '#/components/schemas/UserRef'
        decidedAt:
          type: string
          format: date-time
          example: '2026-09-26T09:15:00Z'
        decisionComment:
          description: Optional comment from the approver, e.g. why it was rejected
          type: string
          maxLength: 500
        createdAt:
          type: string
          format: date-time
          example: '2026-09-25T14:02:00Z'

    PublicHoliday:
      type: object
      required: [date, name]
      properties:
        date:
          type: string
          format: date
          example: '2026-10-05'
        name:
          type: string
          example: Republic Day

    NotificationType:
      description: |
        What happened. The FE picks the icon colour from it; the text comes ready in `message`.

        | Type | Sent to | When | `link` |
        |---|---|---|---|
        | ABSENCE_REQUESTED | the approver | a request needs a decision (BE-3.2) | `/approvals` |
        | ABSENCE_APPROVED | the requester | the approver approved it (BE-5.2) | `/absences?request={id}` |
        | ABSENCE_REJECTED | the requester | the approver rejected it (BE-5.2) | `/absences?request={id}` |
        | ABSENCE_CANCELLED | the approver | the requester cancelled an approved request (BE-3.3) | `/approvals` |
        | TIMESHEET_SUBMITTED | the approver | a week was submitted (BE-6.4) | `/approvals?tab=timesheets` |
        | TIMESHEET_APPROVED | the owner | the approver approved it (BE-7.x) | `/timesheets?week={weekStart}` |
        | TIMESHEET_REJECTED | the owner | the approver rejected it (BE-7.x) | `/timesheets?week={weekStart}` |

        Automatically approved requests (SICK) notify nobody.
      type: string
      enum:
        - ABSENCE_REQUESTED
        - ABSENCE_APPROVED
        - ABSENCE_REJECTED
        - ABSENCE_CANCELLED
        - TIMESHEET_SUBMITTED
        - TIMESHEET_APPROVED
        - TIMESHEET_REJECTED
      example: ABSENCE_REQUESTED

    Notification:
      type: object
      required: [id, type, message, link, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 118
        type:
          $ref: '#/components/schemas/NotificationType'
        message:
          description: |
            Ready-to-show English sentence, written by the backend when the notification is created
            (so it doesn't change later). The FE shows it as it is.
          type: string
          maxLength: 500
          example: Carla Mendes requested 5 days of vacation (2–6 Nov)
        link:
          description: |
            Where clicking it goes: a path inside the app, starting with a single `/` (never a full
            URL). The FE only follows paths like that.
          type: string
          maxLength: 255
          pattern: '^/(?![/\\]).*'
          example: /approvals
        readAt:
          description: When it was read. Absent or null while unread.
          type: string
          format: date-time
          nullable: true
          example: '2026-09-25T15:10:00Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-09-25T14:02:00Z'

    NotificationPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          description: Newest first
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        hasMore:
          description: More (older) items exist; ask again with `before` = the last item's `id`
          type: boolean
          example: false

    UnreadCount:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 0
          example: 3

    Problem:
      description: RFC 9457 Problem Details (decision 21)
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          description: Field errors, only on 400 validation responses
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: must not be blank

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ValidationProblem:
      description: Invalid request; `errors` lists the fields
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Request has invalid fields
            instance: /api/auth/login
            errors:
              - field: email
                message: must be a well-formed email address

    CsrfForbidden:
      description: Missing or wrong `X-XSRF-TOKEN` header
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Unauthorized:
      description: Not logged in, or the session expired
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            instance: /api/me

    Forbidden:
      description: Logged in, but not allowed to do this; also a missing or wrong CSRF token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: You are not allowed to do this
            instance: /api/team/absence-requests/42/approve

    NotFound:
      description: No such resource, or it isn't yours
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Absence request not found
            instance: /api/me/absence-requests/42/cancel

    Conflict:
      description: |
        The request is valid but breaks a business rule. `type` says which one, so the FE can pick
        its message; `detail` is a human-readable English sentence.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/insufficient-balance
            title: Conflict
            status: 409
            detail: Only 3 vacation days left in 2026, but the request needs 5
            instance: /api/me/absence-requests

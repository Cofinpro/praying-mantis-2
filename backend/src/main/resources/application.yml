spring:
  application:
    name: praying-mantis-backend
  datasource:
    # Local Postgres from docker-compose.yml; override via env vars elsewhere
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prayingmantis}
    username: ${DB_USER:prayingmantis}
    password: ${DB_PASSWORD:prayingmantis}
  jpa:
    hibernate:
      # Liquibase owns the schema (decision #23); Hibernate only checks the entities match it
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # No dev seed unless asked for. Careful: an *empty* contexts value would run every changeset,
    # dev ones included, so the default must be a non-empty value that isn't "dev".
    # The dev profile (application-dev.yml, used by ./mvnw spring-boot:run) switches the seed on.
    contexts: ${LIQUIBASE_CONTEXTS:default}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

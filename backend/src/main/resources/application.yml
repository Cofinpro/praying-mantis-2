spring:
  application:
    name: praying-mantis-backend
  datasource:
    # Local Postgres from docker-compose.yml; override via env vars elsewhere
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prayingmantis}
    username: ${DB_USER:prayingmantis}
    password: ${DB_PASSWORD:prayingmantis}
  jpa:
    hibernate:
      # Liquibase owns the schema (decision #23); Hibernate only checks the entities match it
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # "dev" loads the seed data (changesets with context: dev). Any real environment must set
    # LIQUIBASE_CONTEXTS to something else (e.g. prod), or it gets the dev users and their passwords.
    contexts: ${LIQUIBASE_CONTEXTS:dev}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

openapi: 3.0.3
info:
  title: praying-mantis API
  version: 0.10.0
  description: |
    Contract between backend and frontend (decision 2). Agree changes together in a `T` story
    before implementing them. All routes are under /api. Errors are Problem Details (decision 21).

    Authentication (decision 12): `POST /auth/login` starts a server session, kept in an HttpOnly
    `SameSite=Lax` session cookie that the browser sends automatically. Every operation needs that
    session unless it says `security: []`. Without a valid session the answer is 401.

    CSRF: every response sets a readable `XSRF-TOKEN` cookie. Unsafe requests (POST, PUT, PATCH,
    DELETE), including login and logout, must copy it into the `X-XSRF-TOKEN` header; a missing or
    wrong token is 403. The token changes on login, so read the cookie on every request.
servers:
  - url: /api
tags:
  - name: hello
    description: Sample endpoint from BE-0.2, used to check that FE and BE are wired up (M0)
  - name: auth
    description: Log in and out (T-1.1)
  - name: me
    description: The logged-in user (T-1.1)
  - name: absences
    description: Absence types, balance and requests (T-2.1)
  - name: holidays
    description: Public holidays, excluded from working days (T-2.1, decision 15)
  - name: absence-requests
    description: Request and cancel my absences (T-3.1)
  - name: projects
    description: Projects to book hours on (T-6.1)
  - name: timesheets
    description: My weekly timesheets (T-6.1)
  - name: team-timesheets
    description: Timesheets I decide on as approver (T-7.1)
  - name: exports
    description: Monthly timesheet exports as Excel files (T-8.1)
  - name: admin-users
    description: Admin, manage users (T-9.1, BE-9.1)
  - name: admin-entitlements
    description: Admin, manage yearly absence entitlements (T-9.1, BE-9.2)
  - name: admin-projects
    description: Admin, manage projects (T-9.1, BE-9.3)
  - name: admin-holidays
    description: Admin, manage public holidays (T-9.1, BE-9.4)
  - name: team-absences
    description: Absence requests I decide on as approver (T-5.1)
  - name: notifications
    description: In-app notifications for the bell, polled by the FE (T-4.1, decision 17)
security:
  - sessionCookie: []
paths:
  /hello:
    get:
      tags: [hello]
      operationId: getHello
      summary: Say hello
      security: []
      responses:
        '200':
          description: A greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hello'
        default:
          $ref: '#/components/responses/Problem'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with email and password
      description: |
        Checks the password against the stored BCrypt hash. On success, starts a new session (a new
        session id, so an old one can't be reused) and returns the logged-in user, so the FE doesn't
        need a second call to `GET /me`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in. The response sets the session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '401':
          description: |
            Wrong email or password. The detail is the same in both cases, so it doesn't reveal
            whether an account exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Invalid email or password
                instance: /api/auth/login
        default:
          $ref: '#/components/responses/Problem'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Log out
      description: |
        Invalidates the session and clears the cookie. 204 also without a session, so the FE can call
        it without checking first. Like every unsafe request, it needs the CSRF header.
      security: []
      responses:
        '204':
          description: Logged out
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        default:
          $ref: '#/components/responses/Problem'

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: The logged-in user
      description: |
        Used by the app shell for the user name and the role-dependent nav (Approvals only for team
        leads, Admin only for admins), and by the router guard: a 401 means "go to the login page".
      responses:
        '200':
          description: The logged-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /absence-types:
    get:
      tags: [absences]
      operationId: getAbsenceTypes
      summary: All absence types
      description: |
        Small, rarely changing list. The FE uses it for type names and for the request form (T-3.1).
        Balances and requests refer to a type by its `code`.
      responses:
        '200':
          description: Every type, ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AbsenceType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /me/absence-balance:
    get:
      tags: [absences]
      operationId: getMyAbsenceBalance
      summary: My balance per absence type for one year
      description: |
        One entry per type the user has an entitlement for in that year (BE-2.2). Days count in the
        year they fall in, so a request across New Year counts partly in each year. Half days are 0.5.
        `remainingDays` = entitled + carried over − used, and only types that deduct from the
        balance have it (decision 9: computed, not stored). Pending days aren't subtracted; the FE
        shows them next to the remaining days.
      parameters:
        - name: year
          in: query
          description: Defaults to the current year in Europe/Lisbon
          required: false
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
            example: 2026
      responses:
        '200':
          description: The balances, in absence type name order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AbsenceBalance'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /me/absence-requests:
    get:
      tags: [absences]
      operationId: getMyAbsenceRequests
      summary: My absence requests that overlap a date range
      description: |
        For the calendar (BE-2.3). Returns every request that overlaps `[from, to]` (both
        inclusive), in any status, ordered by start date. The FE hides rejected and cancelled ones
        by default. The range may be at most 366 days.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2026-09-28'
        - name: to
          in: query
          description: Inclusive; not before `from`
          required: true
          schema:
            type: string
            format: date
            example: '2026-11-08'
      responses:
        '200':
          description: The requests, by start date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AbsenceRequest'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [absence-requests]
      operationId: createMyAbsenceRequest
      summary: Request an absence
      description: |
        Creates a request for the logged-in user (BE-3.2). The backend computes `workingDays`
        (decision 15) and sets the approver (decision 16).

        - A type that requires approval starts `PENDING`, with the approver set. A type that doesn't
          (SICK) is `APPROVED` straight away, with `decidedAt` set and no approver.
        - Any type may start in the past, e.g. sick leave booked afterwards (decision 29).

        **400** (`errors` names the field):
        - `endDate` before `startDate`
        - day parts that don't fit (see `DayPart`)
        - no working days at all, e.g. only a weekend
        - a range longer than 366 days
        - a missing field, or a `reason` over 500 characters

        **409**, with the reason in the Problem's `type`:
        - `/problems/absence-overlap`: the days overlap one of the user's pending or approved
          requests (decision 14)
        - `/problems/insufficient-balance`: a type that deducts from the balance (VACATION) needs
          more days than are left in a year it touches. "Left" is entitled + carried over − approved;
          pending requests don't count against it. A year without an entitlement has none left
          (decision 29).
        - `/problems/no-approver`: nobody can approve it. That only happens to the sole admin
          without a team lead (decision 16).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAbsenceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceRequest'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /me/absence-requests/{id}/cancel:
    post:
      tags: [absence-requests]
      operationId: cancelMyAbsenceRequest
      summary: Cancel one of my absence requests
      description: |
        Sets the status to `CANCELLED` (decision 13) and frees its days (BE-3.3). A pending request
        can always be cancelled. An approved one only while its start date is still in the future,
        in Lisbon time; once the absence has started, it stays.

        **404** when the request doesn't exist or belongs to someone else, so ids of other people's
        requests aren't confirmed.

        **409** `/problems/absence-not-cancellable`: the request is already rejected or cancelled,
        or it's approved and has started.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 42
      responses:
        '200':
          description: The cancelled request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /public-holidays:
    get:
      tags: [holidays]
      operationId: getPublicHolidays
      summary: Public holidays of one year
      description: |
        Portugal's national holidays. Shown in the calendar and used for the working-days preview of
        the request form (T-3.1).
        The backend's working-days count is the authoritative one (decision 15).
      parameters:
        - name: year
          in: query
          description: Defaults to the current year in Europe/Lisbon
          required: false
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
            example: 2026
      responses:
        '200':
          description: The holidays, by date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicHoliday'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /projects:
    get:
      tags: [projects]
      operationId: getProjects
      summary: Projects to book hours on
      description: |
        BE-6.1. Ordered by code. `active` defaults to `true`, the projects that can take new hours.
        `active=false` returns the inactive ones only, e.g. to label old entries.
      parameters:
        - name: active
          in: query
          required: false
          description: Defaults to `true`
          schema:
            type: boolean
      responses:
        '200':
          description: The projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /me/timesheets/{weekStart}:
    get:
      tags: [timesheets]
      operationId: getMyTimesheet
      summary: My timesheet for one week
      description: |
        BE-6.2. Any week can be opened, past or future. A week that has never been saved comes back as
        an empty `DRAFT` without an `id`: nothing is stored until the first save or submit
        (decision 32). So opening a week has no side effects, and browsing doesn't create rows.

        Also returns the week's approved absences and public holidays, read-only, so the grid can
        mark those days.

        **400** on `weekStart` when it isn't a Monday.
      parameters:
        - $ref: '#/components/parameters/WeekStart'
      responses:
        '200':
          description: The week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheet'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /me/timesheets/{weekStart}/entries:
    put:
      tags: [timesheets]
      operationId: saveMyTimesheetEntries
      summary: Replace all entries of my week
      description: |
        BE-6.3. The body is the whole grid: every entry of the week. Entries missing from it are
        deleted, so an empty list clears the week. All of it happens in one transaction. Creates the
        timesheet on the first save.

        **400** (`errors[].field` is e.g. `entries[2].hours`):
        - `weekStart` isn't a Monday
        - a `workDate` outside the week
        - an unknown project, or an inactive one that isn't already on this timesheet
        - `hours` not in (0, 24], or not in quarter hours
        - two entries for the same project and day (the grid has one cell each)
        - a day with more than 24 hours in total (field `entries`)
        - a `description` over 500 characters

        **409** `/problems/timesheet-not-editable`: the week is `SUBMITTED` or `APPROVED`. A
        `REJECTED` week can be edited again.
      parameters:
        - $ref: '#/components/parameters/WeekStart'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimesheetEntries'
      responses:
        '200':
          description: The saved week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheet'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /me/timesheets/{weekStart}/submit:
    post:
      tags: [timesheets]
      operationId: submitMyTimesheet
      summary: Submit my week for approval
      description: |
        BE-6.4. `DRAFT` or `REJECTED` → `SUBMITTED`. Sets `submittedAt` and the approver, with the same
        rule as for absences (decision 16), and notifies them (`TIMESHEET_SUBMITTED`, T-4.1). A
        week with no hours can be submitted too, e.g. a week spent on vacation. The previous
        rejection's `decisionComment` is cleared.

        **409**:
        - `/problems/timesheet-not-editable`: it's already `SUBMITTED` or `APPROVED`
        - `/problems/no-approver`: the sole admin without a team lead (decision 16)
      parameters:
        - $ref: '#/components/parameters/WeekStart'
      responses:
        '200':
          description: The submitted week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheet'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /team/timesheets:
    get:
      tags: [team-timesheets]
      operationId: getTeamTimesheets
      summary: Timesheets I'm the approver of
      description: |
        For the Timesheets tab of the Approvals page (BE-7.1). The weeks whose stored approver is the
        logged-in user (decisions 16 and 31). Someone who approves nobody gets an empty list.

        Filtered by `status`, which defaults to `SUBMITTED`. Submitted weeks come oldest week first;
        other statuses newest first. Each one carries the whole `Timesheet`, entries included, so the
        expandable row can show the week grid read-only, plus the hours per project.
      parameters:
        - name: status
          in: query
          required: false
          description: Defaults to `SUBMITTED`
          schema:
            $ref: '#/components/schemas/TimesheetStatus'
      responses:
        '200':
          description: The timesheets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamTimesheet'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /team/timesheets/{id}/approve:
    post:
      tags: [team-timesheets]
      operationId: approveTimesheet
      summary: Approve a submitted week
      description: |
        BE-7.2, with the same rules as approving an absence (decision 31). Sets `APPROVED` and
        `decidedAt`, stores the optional comment, and notifies the user (`TIMESHEET_APPROVED`, T-4.1).

        - **403** unless the caller is the stored approver or an admin, and never for the user's own
          week (decision 16)
        - **404** when there's no such timesheet
        - **409** `/problems/timesheet-not-submitted`: it isn't `SUBMITTED`
      parameters:
        - $ref: '#/components/parameters/TimesheetId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimesheetDecision'
      responses:
        '200':
          description: The approved week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheet'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not allowed to decide this week, or a missing CSRF token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /team/timesheets/{id}/reject:
    post:
      tags: [team-timesheets]
      operationId: rejectTimesheet
      summary: Reject a submitted week
      description: |
        BE-7.2. Sets `REJECTED` and `decidedAt`, stores the comment, and notifies the user
        (`TIMESHEET_REJECTED`, T-4.1). **The comment is required** (decision 31), because the user has
        to know what to fix. A rejected week can be edited and submitted again (decision 32).

        The same 403, 404 and 409 `/problems/timesheet-not-submitted` as approve.
      parameters:
        - $ref: '#/components/parameters/TimesheetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimesheetDecision'
      responses:
        '200':
          description: The rejected week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheet'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not allowed to decide this week, or a missing CSRF token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /export-templates:
    get:
      tags: [exports]
      operationId: getExportTemplates
      summary: The export templates
      description: |
        BE-8.1. The templates a month can be exported with, ordered by name. `client` says which
        client a template is for; the generic one has none. The dialog preselects the template of
        the user's client, or the generic one (decision 33).
      responses:
        '200':
          description: The templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExportTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /me/timesheet-months/{month}:
    get:
      tags: [exports]
      operationId: getMyTimesheetMonth
      summary: What an export of my month would contain
      description: |
        BE-8.2. For the export dialog: the hours of the month and the status of every week that
        touches it. A week without a timesheet counts as `DRAFT` with 0 hours. The export includes all
        entries whatever their week's status (decision 18), so the dialog warns when a week isn't
        `APPROVED`.

        **400** on `month` unless it's `YYYY-MM`.
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: The month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetMonth'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /me/timesheet-exports:
    get:
      tags: [exports]
      operationId: exportMyTimesheetMonth
      summary: Download my month as an Excel file
      description: |
        BE-8.2. An `.xlsx` of all the user's entries with a `workDate` in the month, whatever their
        week's status (decision 18). It also lists the month's approved absences. The file is sent
        as an attachment, e.g. `timesheet-2026-10-eva.santos-GENERIC.xlsx`.

        **400**: `month` isn't `YYYY-MM` (field `month`), or `template` isn't a known template code
        (field `template`).
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-10'
        - name: template
          in: query
          required: true
          description: An `ExportTemplate.code`
          schema:
            type: string
            example: GENERIC
      responses:
        '200':
          description: The Excel file
          headers:
            Content-Disposition:
              description: '`attachment; filename="timesheet-2026-10-eva.santos-GENERIC.xlsx"`'
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /me/notifications:
    get:
      tags: [notifications]
      operationId: getMyNotifications
      summary: My notifications, newest first
      description: |
        For the bell's dropdown (FE-4.1). Only the logged-in user's own notifications (BE-4.2),
        newest first (by `createdAt`, then `id`; ids grow with time, so that's the same as `id`
        descending).

        Paginated with a cursor: pass the `id` of the last item you have as `before` to get the next
        page. `hasMore` says whether there is one. A cursor doesn't skip or repeat items when new
        notifications arrive between two pages, which page numbers would.
      parameters:
        - name: unread
          in: query
          description: '`true` returns only unread notifications. Left out or `false`: all of them.'
          required: false
          schema:
            type: boolean
            example: true
        - name: limit
          in: query
          description: Page size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: before
          in: query
          description: Only notifications with an `id` lower than this one (the next page)
          required: false
          schema:
            type: integer
            format: int64
            example: 118
      responses:
        '200':
          description: One page of notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /me/notifications/unread-count:
    get:
      tags: [notifications]
      operationId: getMyUnreadNotificationCount
      summary: How many of my notifications are unread
      description: |
        The bell's badge. The FE polls it every 30 s and when the tab regains focus (decision 17),
        so it has to stay cheap: one `count(*)` on an index over `(user_id) WHERE read_at IS NULL`.
      responses:
        '200':
          description: The unread count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /me/notifications/{id}/read:
    post:
      tags: [notifications]
      operationId: markMyNotificationRead
      summary: Mark one of my notifications as read
      description: |
        Sets `readAt` to now. Idempotent: a notification that is already read keeps its first
        `readAt`, and the answer is still 204.

        **404** when the notification doesn't exist or belongs to someone else, so ids of other
        people's notifications aren't confirmed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 118
      responses:
        '204':
          description: Read
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /me/notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllMyNotificationsRead
      summary: Mark all my notifications as read
      description: |
        Sets `readAt` to now on every unread notification of the logged-in user. 204 also when
        there was nothing to mark.
      responses:
        '204':
          description: All read
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        default:
          $ref: '#/components/responses/Problem'

  /team/absence-requests:
    get:
      tags: [team-absences]
      operationId: getTeamAbsenceRequests
      summary: Absence requests I'm the approver of
      description: |
        For the Approvals page (BE-5.1). Returns the requests whose approver is the logged-in user
        (decision 16): their team members' requests, a team lead's lead's, or, for the admin
        fallback, the requests of people without a team lead. Someone who approves nobody gets an
        empty list, not a 403, so the page can just say "nothing to approve".

        Filtered by `status`, which defaults to `PENDING`. Pending requests come oldest start date
        first, since the soonest need a decision first. Other statuses come newest start first.
      parameters:
        - name: status
          in: query
          required: false
          description: Defaults to `PENDING`
          schema:
            $ref: '#/components/schemas/AbsenceStatus'
      responses:
        '200':
          description: The requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamAbsenceRequest'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /team/absence-requests/{id}/approve:
    post:
      tags: [team-absences]
      operationId: approveAbsenceRequest
      summary: Approve a pending request
      description: |
        BE-5.2. Sets `APPROVED` and `decidedAt`, stores the optional comment, and notifies the
        requester (`ABSENCE_APPROVED`, T-4.1).

        - **403** unless the caller is the request's approver or an admin. Nobody decides on their
          own request, not even an admin (decision 16).
        - **409** `/problems/absence-not-pending`: it's already decided or cancelled.
        - **409** `/problems/insufficient-balance`: a VACATION request that no longer fits, because
          another request was approved in the meantime (decision 29). The approver can still reject
          it.
      parameters:
        - $ref: '#/components/parameters/AbsenceRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceDecision'
      responses:
        '200':
          description: The approved request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceRequest'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /team/absence-requests/{id}/reject:
    post:
      tags: [team-absences]
      operationId: rejectAbsenceRequest
      summary: Reject a pending request
      description: |
        BE-5.2. Sets `REJECTED` and `decidedAt`, stores the comment, and notifies the requester
        (`ABSENCE_REJECTED`, T-4.1). **The comment is required**, so the requester learns why; a
        missing or blank one is a 400 on `comment`.

        Same 403, 404 and 409 `/problems/absence-not-pending` as approve. There's no balance check:
        a rejection frees days, it never uses them.
      parameters:
        - $ref: '#/components/parameters/AbsenceRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceDecision'
      responses:
        '200':
          description: The rejected request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceRequest'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /admin/users:
    get:
      tags: [admin-users]
      operationId: getAdminUsers
      summary: All users
      description: 'BE-9.1. Every user, ordered by name, with their team lead and whether they lead anyone.'
      responses:
        '200':
          description: The users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin (checked against the DB on every call, decision 11)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [admin-users]
      operationId: createAdminUser
      summary: Create a user
      description: |
        BE-9.1. The admin sets the initial password (8 to 72 characters, BCrypt's limit), and the user
        can log in with it straight away. The email is stored in lower case (BE-1.1).

        - **400**: a field is invalid, or `teamLeadId` isn't a user (field `teamLeadId`)
        - **409** `/problems/email-taken`: another user has this email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAdminUser'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin (checked against the DB on every call, decision 11), or a missing CSRF token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /admin/users/{id}:
    put:
      tags: [admin-users]
      operationId: updateAdminUser
      summary: Edit a user
      description: |
        BE-9.1. Replaces name, email, client, level, admin flag and team lead. The password isn't
        changed here; see `/password`. A change of team lead only affects requests and timesheets
        submitted afterwards: the ones already waiting keep their stored approver (decision 31).

        - **400**: a field is invalid; `teamLeadId` isn't a user, or is the user themselves
        - **404**: no such user
        - **409** `/problems/email-taken`
        - **409** `/problems/team-lead-cycle`: the new team lead is already, directly or through others,
          led by this user (frame "12 Admin – Edit user" shows this state)
        - **409** `/problems/last-admin`: this would remove the admin flag from the only admin
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdate'
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin (checked against the DB on every call, decision 11), or a missing CSRF token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /admin/users/{id}/password:
    post:
      tags: [admin-users]
      operationId: setAdminUserPassword
      summary: Set a user's password
      description: 'BE-9.1. For a forgotten password. Existing sessions of that user stay valid until they expire.'
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      responses:
        '204':
          description: Password set
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin (checked against the DB on every call, decision 11), or a missing CSRF token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /admin/entitlements:
    get:
      tags: [admin-entitlements]
      operationId: getAdminEntitlements
      summary: All entitlements of a year
      description: 'BE-9.2. Ordered by user name, then type.'
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
            example: 2027
      responses:
        '200':
          description: The entitlements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminEntitlement'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin (checked against the DB on every call, decision 11)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags: [admin-entitlements]
      operationId: saveAdminEntitlement
      summary: Create or update one entitlement
      description: |
        BE-9.2. There is at most one entitlement per user, type and year, so this is an upsert on
        that key: it creates the entitlement or replaces its days (decision 35). Days are in steps
        of 0.5.

        **400**: a field is invalid, or `userId` isn't a user (field `userId`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntitlementInput'
      responses:
        '200':
          description: The saved entitlement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEntitlement'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin (checked against the DB on every call, decision 11), or a missing CSRF token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /admin/entitlements/{id}:
    delete:
      tags: [admin-entitlements]
      operationId: deleteAdminEntitlement
      summary: Delete an entitlement
      description: 'BE-9.2. The user then has 0 days of that type left in that year (decision 29).'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin (checked against the DB on every call, decision 11), or a missing CSRF token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /admin/projects:
    get:
      tags: [admin-projects]
      operationId: getAdminProjects
      summary: All projects, active and inactive
      description: 'BE-9.3. Ordered by code.'
      responses:
        '200':
          description: The projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin (checked against the DB on every call, decision 11)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [admin-projects]
      operationId: createAdminProject
      summary: Create a project
      description: |
        BE-9.3. **409** `/problems/project-code-taken`: another project has this code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin (checked against the DB on every call, decision 11), or a missing CSRF token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /admin/projects/{id}:
    put:
      tags: [admin-projects]
      operationId: updateAdminProject
      summary: Edit or deactivate a project
      description: |
        BE-9.3. Projects are never deleted, since time entries point at them; `isActive: false` stops
        new hours on it (decision 32).

        **404**: no such project. **409** `/problems/project-code-taken`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: The updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin (checked against the DB on every call, decision 11), or a missing CSRF token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /admin/public-holidays:
    get:
      tags: [admin-holidays]
      operationId: getAdminPublicHolidays
      summary: The public holidays of a year, with their ids
      description: 'BE-9.4. Ordered by date.'
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
            example: 2028
      responses:
        '200':
          description: The holidays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminPublicHoliday'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin (checked against the DB on every call, decision 11)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [admin-holidays]
      operationId: createAdminPublicHoliday
      summary: Add a public holiday
      description: |
        BE-9.4, e.g. next year's list. Existing absence requests keep their stored working days
        (decision 15), so this only affects requests created afterwards.

        **409** `/problems/holiday-date-taken`: that date is already a holiday.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicHoliday'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPublicHoliday'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin (checked against the DB on every call, decision 11), or a missing CSRF token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /admin/public-holidays/{id}:
    put:
      tags: [admin-holidays]
      operationId: updateAdminPublicHoliday
      summary: Edit a public holiday
      description: |
        BE-9.4. **404**: no such holiday. **409** `/problems/holiday-date-taken`.
      parameters:
        - $ref: '#/components/parameters/HolidayId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicHoliday'
      responses:
        '200':

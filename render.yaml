# Render Blueprint for the app: the frontend, the backend API and its database (decision #30).
# Set up once: Render dashboard -> New -> Blueprint -> pick this repo. After that, Render syncs this
# file on every push to main and redeploys what changed, once the CI checks have passed.
services:
  # The real frontend (not the MSW demo on GitHub Pages). The browser only ever talks to this site:
  # /api/* is proxied to the backend, so the session and XSRF-TOKEN cookies stay first-party
  # (decision #12). Rules apply in order, and never to a file that exists in dist/.
  - type: web
    name: praying-mantis-web
    runtime: static
    branch: main
    rootDir: frontend
    # Corepack runs the pnpm version pinned in package.json (decision #5); no global install needed
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://praying-mantis-api-u1c3.onrender.com/api/*
      # Vue Router's history mode: a reload on /absences must still get index.html
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: praying-mantis-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./backend/Dockerfile
    # The build reads api/openapi.yaml, so the context is the repo root, not backend/
    dockerContext: .
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
        - api/**
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: praying-mantis-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: praying-mantis-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: praying-mantis-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: praying-mantis-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: praying-mantis-db
          property: password
      # Render serves the API over https only
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # Loads the dev seed users (README, "Dev users") so the demo has accounts. Their passwords are
      # public, so this database must only ever hold demo data.
      - key: LIQUIBASE_CONTEXTS
        value: dev

databases:
  - name: praying-mantis-db
    plan: free
    region: frankfurt
    databaseName: prayingmantis
    user: prayingmantis
    postgresMajorVersion: "17"

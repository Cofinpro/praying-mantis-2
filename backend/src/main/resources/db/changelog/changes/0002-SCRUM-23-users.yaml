# BE-1.1: users (plan.md §4). "Is team lead" is derived from team_lead_id, not stored (decision #9).
databaseChangeLog:
  - changeSet:
      id: 0002-users-table
      author: praying-mantis
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: ALWAYS
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_users_email
              - column:
                  name: password_hash
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: client
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: level
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: is_admin
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: team_lead_id
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_users_team_lead
                    references: users(id)
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            tableName: users
            indexName: idx_users_team_lead_id
            columns:
              - column:
                  name: team_lead_id
        # Enum values match the Java constant names (decision #8) and the API contract
        - sql:
            sql: >-
              alter table users
                add constraint ck_users_client check (client in ('DKB', 'DEKA', 'VV', 'DBIS', 'UNION')),
                add constraint ck_users_level check (level in ('JUNIOR', 'EXPERT', 'SENIOR', 'ARCHITECT', 'SENIOR_ARCHITECT')),
                add constraint ck_users_email_lowercase check (email = lower(email)),
                add constraint ck_users_not_own_team_lead check (team_lead_id <> id)
      rollback:
        - dropTable:
            tableName: users

